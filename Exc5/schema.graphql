schema {
  query: Query
}

type Query {
  # Запрос информации о клиенте по ID
  client(id: ID!): Client
}

type Client {
  id: ID!
  name: String
  age: Int
  # Список документов, связанных с клиентом
  documents: [Document!]
  # Список родственников клиента
  relatives: [Relative!]
}

type Document {
  id: ID!
  type: String
  number: String
  issueDate: String
  expiryDate: String
}

type Relative {
  id: ID!
  relationType: String
  name: String
  age: Int
}
