apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletest-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletest
  template:
    metadata:
      labels:
        app: scaletest
    spec:
      containers:
      - name: scaletest
        image: shestera/scaletestapp:latest
        ports:
        - containerPort: 8080
        resources:
            limits:
              memory: "30Mi"